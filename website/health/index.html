<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#030407" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="Current availability of the getocean.dev public website."
    />
    <title>Website operational · Ocean</title>
    <link rel="canonical" href="https://getocean.dev/health/" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="stylesheet" href="/utility-pages.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="utility-card" aria-labelledby="page-title">
        <div class="brand" aria-label="Ocean">
          <img
            class="brand__mark"
            src="/favicon.png"
            alt=""
            width="44"
            height="44"
          />
          <span class="brand__name">Ocean</span>
        </div>

        <div class="content">
          <p class="eyebrow eyebrow--healthy">
            <span class="status-dot" aria-hidden="true"></span>
            Website health
          </p>
          <h1 id="page-title">Website operational</h1>
          <p class="intro">
            <strong>getocean.dev</strong> is responding normally.
          </p>

          <div class="health-summary">
            <div class="health-summary__icon" aria-hidden="true">
              <svg viewBox="0 0 20 20" width="20" height="20" fill="none">
                <path d="m5 10.2 3.1 3.1L15 6.7" />
              </svg>
            </div>
            <div>
              <strong>Public website · HTTP 200</strong>
              <span>
                This check covers the getocean.dev website only. It does not
                check the Ocean app, APIs, relay, or other services.
              </span>
            </div>
          </div>
        </div>

        <footer class="card-footer">
          <a class="secondary-link" href="/">Return to Ocean</a>
          <a class="machine-link" href="/health.json">View health.json</a>
        </footer>
      </section>
    </main>
  </body>
</html>
